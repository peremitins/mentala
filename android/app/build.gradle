apply plugin: 'com.android.application'

import java.util.zip.ZipFile

def isTruthy = { value ->
    if (value == null) return false

    def normalized = value.toString().trim().toLowerCase()
    return ['1', 'true', 'yes', 'on'].contains(normalized)
}

// Play Console track не прокидывается в Gradle build type автоматически:
// internal testing, closed testing и production обычно используют один и тот же
// release build. Поэтому оптимизацию включаем только явным флагом.
def releaseOptimizationEnabled =
    isTruthy(findProperty('mentalaEnableMinify')) ||
    isTruthy(System.getenv('MENTALA_ANDROID_ENABLE_MINIFY'))

android {
    namespace "com.mentala.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mentala.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.1.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Для production рекомендуем R8 + shrinkResources, но включаем их
            // только явным флагом, чтобы internal/closed testing не ломались
            // внезапно из-за keep rules для Capacitor/кастомных плагинов.
            minifyEnabled releaseOptimizationEnabled
            shrinkResources releaseOptimizationEnabled
            // Добавляем таблицу символов для native crash/ANR в Play Console
            // без включения R8/ProGuard, чтобы не рисковать регрессиями в релизе.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        // Синхронизируем с capacitor.build.gradle (Java 21)
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Подавить предупреждения о deprecated API в библиотеках
// Вынесено на уровень модуля для лучшей совместимости
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-deprecation']
}

dependencies {
    // Подключаем JAR файлы из libs, если они есть
    // implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase для push-уведомлений
    // Инициализация настроена в MainApplication.java для работы без google-services.json
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

def releaseAabFile = file("$buildDir/outputs/bundle/release/app-release.aab")
def releaseMappingFile = file("$buildDir/outputs/mapping/release/mapping.txt")
def releaseNativeSymbolsDir = file("$buildDir/outputs/native-debug-symbols/release")
def releaseNativeSymbolsFile = file("$buildDir/outputs/native-debug-symbols/release/native-debug-symbols.zip")
def releaseNativeSymbolsFallbackFile = file("$buildDir/outputs/native-debug-symbols/release/native-debug-symbols-fallback.zip")
def releaseMergedNativeLibsDir = file("$buildDir/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib")
def releasePlayConsoleDir = file("$buildDir/outputs/play-console/release")

tasks.register('zipReleaseNativeDebugSymbolsFallback', Zip) {
    group = 'distribution'
    description = 'Создаёт fallback-архив native symbols для Google Play, если AGP не сформировал стандартный zip.'
    dependsOn 'mergeReleaseNativeLibs'
    from(releaseMergedNativeLibsDir)
    include '**/*.so'
    destinationDirectory = releaseNativeSymbolsDir
    archiveFileName = 'native-debug-symbols-fallback.zip'

    onlyIf {
        releaseMergedNativeLibsDir.exists()
    }
}

tasks.register('prepareReleasePlayConsoleArtifacts') {
    group = 'distribution'
    description = 'Проверяет release AAB и собирает полный набор артефактов для Google Play Console.'
    dependsOn 'bundleRelease', 'zipReleaseNativeDebugSymbolsFallback'

    doLast {
        if (!releaseAabFile.exists()) {
            throw new Exception("Не найден Android App Bundle: ${releaseAabFile}")
        }

        if (!releaseMappingFile.exists()) {
            throw new Exception(
                "Не найден mapping.txt. Для prod build должен быть включён R8/ProGuard."
            )
        }

        ZipFile bundleZip = new ZipFile(releaseAabFile)
        try {
            // Проверяем, что файл деобфускации реально попал внутрь AAB,
            // иначе Play Console продолжит ругаться на отсутствие mapping.
            def mappingEntry = bundleZip.getEntry(
                'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'
            )

            if (mappingEntry == null) {
                throw new Exception(
                    'Внутри app-release.aab отсутствует BUNDLE-METADATA/.../proguard.map.'
                )
            }
        } finally {
            bundleZip.close()
        }

        def nativeSymbolsForPlay = releaseNativeSymbolsFile.exists()
            ? releaseNativeSymbolsFile
            : releaseNativeSymbolsFallbackFile

        if (!nativeSymbolsForPlay.exists()) {
            throw new Exception(
                "Не найден native-debug-symbols.zip. " +
                "Проверь native зависимости и генерацию symbols для release build."
            )
        }

        delete(releasePlayConsoleDir)
        mkdir(releasePlayConsoleDir)

        copy {
            from(releaseAabFile)
            into(releasePlayConsoleDir)
        }

        copy {
            from(releaseMappingFile)
            into(releasePlayConsoleDir)
        }

        copy {
            from(nativeSymbolsForPlay)
            into(releasePlayConsoleDir)
            rename { 'native-debug-symbols.zip' }
        }

        def nativeSymbolsSource = releaseNativeSymbolsFile.exists()
            ? 'agp-native-debug-symbols'
            : 'fallback-merged-native-libs'

        def metadataFile = new File(releasePlayConsoleDir, 'artifacts-info.txt')
        metadataFile.text =
            "AAB=${releaseAabFile.name}\n" +
            "MAPPING=${releaseMappingFile.name}\n" +
            "NATIVE_SYMBOLS=native-debug-symbols.zip\n" +
            "NATIVE_SYMBOLS_SOURCE=${nativeSymbolsSource}\n"

        println "✓ Play Console artifacts prepared: ${releasePlayConsoleDir}"
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
