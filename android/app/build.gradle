apply plugin: 'com.android.application'

def isTruthy = { value ->
    if (value == null) return false

    def normalized = value.toString().trim().toLowerCase()
    return ['1', 'true', 'yes', 'on'].contains(normalized)
}

// Play Console track не прокидывается в Gradle build type автоматически:
// internal testing, closed testing и production обычно используют один и тот же
// release build. Поэтому оптимизацию включаем только явным флагом.
def releaseOptimizationEnabled =
    isTruthy(findProperty('mentalaEnableMinify')) ||
    isTruthy(System.getenv('MENTALA_ANDROID_ENABLE_MINIFY'))

android {
    namespace "com.mentala.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mentala.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Для production рекомендуем R8 + shrinkResources, но включаем их
            // только явным флагом, чтобы internal/closed testing не ломались
            // внезапно из-за keep rules для Capacitor/кастомных плагинов.
            minifyEnabled releaseOptimizationEnabled
            shrinkResources releaseOptimizationEnabled
            // Добавляем таблицу символов для native crash/ANR в Play Console
            // без включения R8/ProGuard, чтобы не рисковать регрессиями в релизе.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        // Синхронизируем с capacitor.build.gradle (Java 21)
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Подавить предупреждения о deprecated API в библиотеках
// Вынесено на уровень модуля для лучшей совместимости
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-deprecation']
}

dependencies {
    // Подключаем JAR файлы из libs, если они есть
    // implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase для push-уведомлений
    // Инициализация настроена в MainApplication.java для работы без google-services.json
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
