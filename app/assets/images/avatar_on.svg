<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassA" x1="3" y1="3" x2="21" y2="21"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(255,255,255,0.65)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <linearGradient id="strokeA" x1="0" y1="0" x2="24" y2="24">
      <stop stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.25)"/>
    </linearGradient>
    <filter id="blurA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- стеклянная таблетка -->
  <rect x="2.25" y="2.25" width="19.5" height="19.5" rx="9.75"
        fill="url(#glassA)" stroke="url(#strokeA)"/>
  <rect x="2.25" y="2.25" width="19.5" height="19.5" rx="9.75"
        fill="white" opacity="0.08" filter="url(#blurA)"/>

  <!-- аватар: голова + плечи -->
  <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M12 12.1c1.9 0 3.3-1.45 3.3-3.25S13.9 5.6 12 5.6 8.7 7.05 8.7 8.85 10.1 12.1 12 12.1z" />
    <path d="M6.5 18.2c.7-2.5 3-4.1 5.5-4.1s4.8 1.6 5.5 4.1" />
  </g>
</svg>